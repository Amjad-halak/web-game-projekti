<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>ArcadiaIndex</title>
</head>

<body>
    <div class="parent">
        <div class="UpDiv">  <!--Smaller?-->
            <div class="logo_div">
                <img src="img/ArcadiaWhite.png" alt="Logo_picture" />
            </div>
        </div>
        <div class="I_CenterDiv">
            <div class="I_row1">
                <h1>Welcum to Arcadia!</h1> <!--Logo in black or nah? -->
                <h2>Enter your name to start the game</h2>
            </div>

            <div class="I_row2">
                <!--Form for entering name-->       
            <form id="player_form" class="name_form" action="/game" method="post">
                 <!--Name for the player-->
                <input  type="text"
                        name="username"
                        class="name_input"
                        placeholder="Enter your name here" required>
            </form>
            </div>
                    <!--Confirm button--> 
                <div class="I_row3">  
                        <!--Add alert asking to enter name if not provided?-->
                    <input  type="submit"
                            value="Confirm" 
                            class="CButton"
                            form="player_form">             
                </div>
    </div>
    
</body>
</html>
