<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="{{url_for('static', filename='script.js')}}" defer></script>
    <title>ArcadiaIndex</title>
</head>

<body>
    <div class="parent">

        <header class="top-bar">
            <div class="top-left"></div>

            <div class="top-center">
                <img src="{{url_for('static', filename='img/ArcadiaWhite.png')}}" alt="Logo_picture" />
            </div>

            <div class="top-right"></div>
        </header>

        <div class="I_CenterDiv">
            <div class="I_row1">
                <h1>Welcum to Arcadia!</h1> 
                <h2>Enter your name to start the game</h2>
            </div>

            <div class="I_row2">
                      
            <form id="player_form" class="name_form" action="/menu" method="post">
                 <!--Name for the player-->
                <input  type="text"
                        name="username"
                        class="name_input"
                        placeholder="Enter your name here" required>
            </form>
            </div>

                <div class="I_row3">  
                    <input  type="submit"
                            value="Confirm" 
                            class="CButton"
                            form="player_form">             
                </div>
        </div>
    </div>
    
</body>
</html>
