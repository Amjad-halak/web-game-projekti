<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ArcadiaMenu</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}"  />

</head>

<body>
    <div class="parent">
        <header class="top-bar">
            <div class="top-left">Vasen</div>

            <div class="top-center">
                <img src="{{url_for('static', filename='img/ArcadiaWhite.png')}}" alt="Logo_picture" />
            </div>

            <div class="top-right">
                <a href="profile.html" class="player-link">
            <div class="player-box">
                <div class="player-avatar">Ava</div>
                <div class="player-info">
                    <span id="player-name">pelaaja:</span>
                    <span id="player-score">0 pts</span>
                </div>
            </div>
                </a>
            </div>
        </header>
        
        <div class="M_CenterDiv">
                
            <div class="M_row1"></div>

            <div class="M_row2">
                <form class="name_form" action="/games" method="post">
                    <input  type="submit"
                            value="Games" 
                            class="CButton">
                </form>
            </div>

            <div class="M_row3">                <!--Scoreboard-->
                <form class="name_form" action="/how_to" method="post">
                    <input  type="submit"
                            value="How to play" 
                            class="CButton">
                </form>
            </div>
            
            <div class="M_row4">
                <!--Scoreboard-->
                <form class="name_form" action="/menu" method="post">
                    <input type="submit" value="Scoreboard" class="CButton"> 
                </form>
            </div> 

            <div class="M_row5">
                <form class="name_form" action="/name" method="post">
                    <input type="submit" value="Return" class="CButton"> 
                </form>
            </div>
        </div>
    </div>
    
</body>
</html>
